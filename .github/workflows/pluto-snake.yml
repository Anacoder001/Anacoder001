name: Pluto Snake

on:
  schedule:
    - cron: "0 0 * * *"  # once per day at midnight (instead of every 6 hours)
  workflow_dispatch:         # manual Run button

permissions:
  contents: write
  pages: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk@v3
        with:
          github_user_name: Anacoder001
          outputs: |
            dist/snake.svg
            dist/pluto-snake.svg?color_snake=#FF00FF&color_dots=#0d1117,#1a0033,#6e00ff,#bd00ff,#ff77ff
            dist/pluto-snake.gif?color_snake=#FF00FF&color_dots=#0d1117,#1a0033,#6e00ff,#bd00ff,#ff77ff
            dist/pluto-snake-dark.svg?color_snake=#FF00FF&color_dots=#ff77ff,#bd00ff,#6e00ff,#1a0033,#0d1117

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
