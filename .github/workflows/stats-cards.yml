name: Stats Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Generate stats
        run: |
          mkdir -p profile
          curl -L "https://github-readme-stats.vercel.app/api?username=Anacoder001&show_icons=true&count_private=true&include_all_commits=true&hide_border=true&bg_color=0D1117&title_color=FF00FF&icon_color=BD00FF&text_color=FFFFFF&ring_color=BD00FF" -o profile/stats.svg
          curl -L "https://github-readme-stats.vercel.app/api/top-langs?username=Anacoder001&layout=compact&hide_border=true&bg_color=0D1117&title_color=FF00FF&text_color=BD00FF&hide=html,css" -o profile/top-langs.svg
      
      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          git commit -m "update stats cards" || exit 0
          git push
