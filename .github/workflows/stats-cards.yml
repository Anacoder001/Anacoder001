name: Stats Cards

on:
  schedule:
    - cron: "0 3 * * *"   # every night at 03:00 UTC
  workflow_dispatch:        # manual Run button

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # ── Stats card ──────────────────────────────────────────────────────────
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=Anacoder001
            &show_icons=true
            &count_private=true
            &include_all_commits=true
            &hide_border=true
            &bg_color=0D1117,000000
            &title_color=FF00FF
            &icon_color=BD00FF
            &text_color=FFFFFF
            &ring_color=BD00FF
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Top languages card ───────────────────────────────────────────────────
      - name: Generate top-langs card
        uses: readme-tools/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=Anacoder001
            &layout=compact
            &hide_border=true
            &bg_color=0D1117,000000
            &title_color=FF00FF
            &text_color=BD00FF
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Commit both SVGs back to main ────────────────────────────────────────
      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          git commit -m "update stats cards" || exit 0
          git push
